<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- Fond officiel Bleu Nuit -->
  <rect width="520" height="120" rx="16" fill="#071B3A"/>
  
  <!-- Définitions d'effets subtils et dégradés conformes -->
  <defs>
    <linearGradient id="immoGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35C928"/>
      <stop offset="100%" stop-color="#28A71C"/>
    </linearGradient>
    <linearGradient id="immoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2F5E"/>
      <stop offset="100%" stop-color="#071B3A"/>
    </linearGradient>
  </defs>

  <!-- Symbole Immobilier Officiel -->
  <g id="immo-symbol" transform="translate(24, 15)">
    <!-- Cercle de fond vert protecteur -->
    <circle cx="45" cy="45" r="42" fill="#0E2F5E" stroke="#35C928" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Courbes dynamiques vertes entourant le symbole -->
    <path d="M 12 55 C 18 80, 55 92, 78 72 C 60 84, 25 76, 18 55 Z" fill="#35C928" opacity="0.85"/>
    <path d="M 78 35 C 72 10, 35 -2, 12 18 C 30 6, 65 14, 72 35 Z" fill="#35C928" opacity="0.85"/>
    
    <!-- Petit cercle accent vert -->
    <circle cx="76" cy="22" r="5" fill="#35C928"/>

    <!-- Groupe Immeubles et Maison en BLANC (#FFFFFF) -->
    <!-- Immeuble arrière-plan gauche -->
    <rect x="22" y="28" width="14" height="42" fill="#FFFFFF" rx="1.5"/>
    <!-- Fenêtres immeuble gauche -->
    <rect x="25" y="32" width="3" height="4" fill="#071B3A"/>
    <rect x="30" y="32" width="3" height="4" fill="#071B3A"/>
    <rect x="25" y="39" width="3" height="4" fill="#071B3A"/>
    <rect x="30" y="39" width="3" height="4" fill="#071B3A"/>
    <rect x="25" y="46" width="3" height="4" fill="#071B3A"/>
    <rect x="30" y="46" width="3" height="4" fill="#071B3A"/>

    <!-- Grand Immeuble central -->
    <rect x="38" y="18" width="18" height="52" fill="#FFFFFF" rx="1.5"/>
    <!-- Toit biseauté moderne / acrotère -->
    <polygon points="38,18 47,12 56,18" fill="#FFFFFF"/>
    <!-- Fenêtres grand immeuble -->
    <rect x="42" y="22" width="3.5" height="4" fill="#071B3A"/>
    <rect x="48" y="22" width="3.5" height="4" fill="#071B3A"/>
    <rect x="42" y="29" width="3.5" height="4" fill="#071B3A"/>
    <rect x="48" y="29" width="3.5" height="4" fill="#071B3A"/>
    <rect x="42" y="36" width="3.5" height="4" fill="#071B3A"/>
    <rect x="48" y="36" width="3.5" height="4" fill="#071B3A"/>
    <rect x="42" y="43" width="3.5" height="4" fill="#071B3A"/>
    <rect x="48" y="43" width="3.5" height="4" fill="#071B3A"/>
    <!-- Entrée principale vitrée -->
    <rect x="44" y="58" width="6" height="12" fill="#35C928" rx="1"/>

    <!-- Maison résidentielle avant-plan droit avec toit en pointe -->
    <polygon points="56,40 68,30 80,40" fill="#FFFFFF"/>
    <rect x="58" y="40" width="20" height="30" fill="#FFFFFF" rx="1"/>
    <!-- Fenêtre maison -->
    <rect x="61" y="44" width="4" height="5" fill="#071B3A"/>
    <rect x="71" y="44" width="4" height="5" fill="#071B3A"/>
    <!-- Porte d'entrée maison -->
    <rect x="65" y="55" width="6" height="15" fill="#071B3A" rx="1"/>

    <!-- Courbe de socle vert (sol / terrain) -->
    <path d="M 16 70 Q 45 74 76 70" stroke="#35C928" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typographie Officielle -->
  <g transform="translate(132, 28)">
    <!-- Titre Principal IMMO -->
    <text x="0" y="40" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#FFFFFF">
      IMMO <tspan fill="#35C928">GESTION</tspan>
    </text>
    <!-- Baseline professionnelle -->
    <text x="2" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#94A3B8">
      GESTION IMMOBILIÈRE PROFESSIONNELLE
    </text>
  </g>
</svg>

